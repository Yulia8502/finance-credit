function parseCSV(text){text=text.replace(/^\uFEFF/,'');const delim=text.split(/\r?\n/)[0].includes(';')?';':',';let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(q&&text[i+1]==='"'){cell+='"';i++;}else q=!q;}else if(ch===delim&&!q){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell='';}else cell+=ch;}if(q)throw Error('Незакрытая кавычка в CSV');row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows;}

const helpSections=[
 ['Начало работы','Откройте HTML в современном браузере. В «Настройках» создайте пустую модель или замените учебные данные. Все входные суммы — рубли с копейками, ставки — проценты годовых (11 = 11%), покрытие и коэффициенты — доли (0,5 = 50%). Расчет выполняется автоматически после сохранения записи.'],
 ['Порядок заполнения','1. Настройки и горизонт. 2. Источники. 3. Транши и начальный долг. 4. Счета эскроу и остатки. 5. Полные редакции условий и шкалы. 6. История и прогноз КС. 7. Денежные операции. 8. История остатков и банковский календарь при необходимости. 9. Контрольные периоды банка. 10. Устранение ошибок и Excel.'],
 ['Откуда брать значения','Условия, лимиты, даты действия, методы остатков, фиксацию КС и округление — из подписанного договора, допсоглашений и согласованной методики банка. Остатки и операции — из банковских выписок по датам валютирования. Прогноз выборок — из кредитного и платежного планов; прогноз эскроу — из графиков оплат ДДУ с учетом возвратов. Продажа сама по себе не означает поступление денег. Факт КС — официальная история Банка России: https://www.cbr.ru/hd_base/procstav/ir_chg_mpo/. Интернет-загрузка не выполняется.'],
 ['Источники и полнота','Поле «Подтвержден» в источнике означает, что документ проверен. Источники типа «Кредит» и «Эскроу» с началом и концом периода подтверждают полноту банковских движений, включая дни без операций. Путь или ссылка хранится как текст; сам документ не загружается. Метаданные загрузки и прежние значения сохраняются в журнале.'],
 ['Версии и обратная сила','Каждая редакция самодостаточна. Дата начала включается, конец исключается. Копируйте редакцию кнопкой ＋, меняйте код, даты и нужные условия; у предыдущей укажите конец, равный началу новой. Для ретроактивного изменения сохраните старую JSON-копию и прежнюю сумму модели в банковской сверке. Дата подписания, юридическая дата и дата внесения хранятся отдельно.'],
 ['Движение долга','Долг на конец = долг на начало + выборка − погашение + корректировка + капитализация. Уплата процентов не влияет на основной долг. Начальный долг не повторяется выборкой. Конечный долг предыдущего дня становится начальным долгом следующего. Лимиты задаются по траншам; общий лимит линии при нескольких траншах должен быть распределен между ними.'],
 ['Движение эскроу','Эскроу на конец = эскроу на начало + поступления − возвраты − раскрытие + корректировка. Расчет учитывает только допустимые счета с коэффициентами. Для нескольких траншей каждый счет привязывается к одному траншу; распределение общего покрытия нужно согласовать до ввода. Допуск счета постоянен внутри его учетной записи.'],
 ['Остатки и окна','«Начало дня» исключает сегодняшние операции; «Конец дня» включает их. Предыдущий банковский день использует закрывающий остаток предыдущего рабочего дня. Среднее и минимум за окно используют закрывающие остатки, включая текущий день. Предыдущий период — завершенный интервал от установленного дня до дня перед началом следующего. История окна до начала модели вводится отдельно, без автоматической замены отсутствующих данных нулем.'],
 ['Формулы ставки','Фиксированная: Rate = Base. Скидка: Rate = min(потолок, max(пол, КС + маржа − скидка ступени)). Готовая шкала: Rate = ставка ступени. Две части: Covered = min(долг, расчетное эскроу × коэффициент части); Interest = (Covered × CoveredRate + Uncovered × BaseRate) / 100 / Basis. Для непокрытой части можно выбрать КС + маржа. Проценты по единой ставке = долг × ставка / 100 / база дней.'],
 ['База и округление','ACT/365, ACT/366 и ACT/360 используют постоянные знаменатели. ACT/ACT — 365 или 366 по календарному году. Точность ставки — число знаков после запятой в процентах. При ежедневном округлении каждый день округляется до копеек. При периодическом округлении разница между округленной суммой и суммой необработанных дней относится на последний день периода. На конце горизонта незакрытый период также округляется для отчета и помечается.'],
 ['Капитализация','Вариант «В конце периода» капитализирует начисленные проценты после расчета последнего дня договорного периода; новый долг влияет на следующий день. Конец неполного горизонта не вызывает капитализацию. Если расчет начинается не с начала периода, необходимо расширить горизонт до начала периода: входящий остаток еще не капитализированных процентов не поддерживается. Смена округления, капитализации или дня периода внутри периода требует отдельной методики и блокируется. Иные правила капитализации требуют изменения расчетного модуля.'],
 ['Ключевая ставка и календарь','Фиксация — ежедневно, на первое число месяца или на заданный день. Если заданный день текущего месяца еще не наступил, берется предыдущий месяц. Затем дата сдвигается назад на лаг. При банковском лаге пропускаются нерабочие дни по календарю банка. Автоматического переноса даты фиксации с выходного при нулевом лаге нет. История факта используется по дате фиксации до отсечения; далее необходим явный прогноз КС.'],
 ['Факт и сценарии','Фактические операции до отсечения вытесняют прогноз закрытой части; прогноз никогда не заполняет пробел факта. Факт после отсечения — ошибка. Базовые входы наследуются; сценарная операция с тем же ключом заменяет базовую прогнозную операцию, новая — добавляется. Для отмены операции задайте нулевую сумму с тем же ключом. Шкала привязана к коду редакции. Сценарная редакция действует только после отсечения и даты начала сценария.'],
 ['Эффект условий','Для каждой альтернативы выполняются прогоны с одинаковыми графиками операций и КС: с альтернативными и базовыми условиями. Их разница показывает эффект условий с учетом изменения долга при капитализации. Дополнительный прогон фиксирует капитализацию базовых условий для сравнения на одинаковом долге. Сценарные условия не используются в фактических днях.'],
 ['Excel','Кнопка формирует автономный .xlsx с русскими листами без макросов и внешних ссылок. Это проверяемый снимок расчета: исходные регистры, выбранный сценарий, ежедневные параметры, месячные суммы, сценарии, сверка и журнал. Базовые арифметические формулы процентов и месячных итогов доступны в Excel, сложный подбор условий и сценариев выполняется в HTML. После изменения исходных регистров в Excel весь расчет автоматически не перестраивается: для нового расчета изменяйте данные в HTML и выгружайте заново. Расчетные листы защищены от случайного ввода; защита без пароля снимается стандартными средствами Excel.'],
 ['Импорт и сохранение','JSON сохраняет полную модель и журнал и предназначен для переноса и резервного копирования. CSV добавляет строки выбранного регистра и никогда не затирает старые. Сначала выгрузите CSV этой вкладки как образец заголовков. Кодировка UTF-8, разделитель ;, даты ГГГГ-ММ-ДД, Да/Нет для переключателей. После загрузки проверьте дубли. Автосохранение зависит от браузера, режима приватности и пути HTML; для надежного хранения используйте JSON.'],
 ['Сверка и приемка','Сверьте 2–3 закрытых банковских периода и граничные даты. В банковской сверке укажите независимые суммы, остатки, покрытие, дату КС, редакцию и эффективную ставку. Расхождения не списываются автоматически на округление. Контрольные поля на конец дня берутся из последней строки периода. Для ежедневной контрольной точки используйте однодневную сверку. При ошибках итоговая сумма скрывается и экспорт Excel заблокирован.'],
 ['Границы модели','Один проект и договор, несколько независимо рассчитываемых траншей. RUB; фактические календарные дни, до 30 лет. Комиссии, налоги, неустойки и учетная капитализация отражаются справочно и не включаются в проценты. Не реализованы банковские методики, отличные от перечисленных переключателей, автоматическое распределение общего эскроу между траншами и импорт произвольной выписки банка. Журнал локальный и не является защищенным банковским аудитом. Перед управленческим использованием подтвердите договорные параметры и полноту факта.']
